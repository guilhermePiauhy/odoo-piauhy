[options]
; =============================================================================
; Odoo 17 Base Configuration
; Repository: guilhermePiauhy/odoo-piauhy
;
; This file is mounted read-only into the container:
;   ./config/odoo.conf -> /etc/odoo/odoo.conf
;
; Sensitive values (db_password, admin_passwd) are injected via environment
; variables at container start. Do NOT hardcode credentials here.
; =============================================================================

; -----------------------------------------------------------------------------
; Database connection
; These are overridden by the HOST / PORT / USER / PASSWORD environment
; variables set in docker-compose, so they serve as documented defaults only.
; -----------------------------------------------------------------------------
db_host = db
db_port = 5432
db_user = odoo
db_password = False
db_name = False
db_maxconn = 64

; -----------------------------------------------------------------------------
; Master password — MUST be changed before first use.
; Use a strong random value. Generate with:
;   python3 -c "import secrets; print(secrets.token_hex(32))"
; Set ODOO_ADMIN_PASSWD in your .env file and inject it here, or update
; this value directly and keep the file out of version control.
; -----------------------------------------------------------------------------
admin_passwd = CHANGE_ME_USE_ENV_VAR

; -----------------------------------------------------------------------------
; HTTP server
; In production the proxy_mode flag tells Odoo to trust X-Forwarded-* headers
; sent by Nginx. Never enable this without a reverse proxy in front.
; -----------------------------------------------------------------------------
http_interface = 0.0.0.0
http_port = 8069
longpolling_port = 8072
proxy_mode = True

; -----------------------------------------------------------------------------
; Paths
; -----------------------------------------------------------------------------
data_dir = /var/lib/odoo
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; -----------------------------------------------------------------------------
; Logging
; Options: debug_rpc_answer, debug_rpc, debug, info, warn, error, critical
; Use "info" in production; "debug" only for local development troubleshooting.
; -----------------------------------------------------------------------------
log_level = info
log_handler = :INFO
logfile = False   ; Log to stdout so Docker captures it via json-file driver

; -----------------------------------------------------------------------------
; Workers and performance
; Rule of thumb for workers: (CPU cores * 2) + 1
; Set to 0 to use the single-threaded development server (dev stack only).
; Recommended for production: 4-8 workers depending on server resources.
; -----------------------------------------------------------------------------
workers = 4
max_cron_threads = 2
limit_memory_hard = 2684354560   ; 2.5 GB per worker
limit_memory_soft = 2147483648   ; 2 GB per worker
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 3600

; -----------------------------------------------------------------------------
; Email — outgoing SMTP (update via system settings or override here)
; -----------------------------------------------------------------------------
; smtp_server = smtp.example.com
; smtp_port = 587
; smtp_ssl = False
; smtp_user = noreply@example.com
; smtp_password = your_smtp_password

; -----------------------------------------------------------------------------
; Security — restrict database manager to localhost
; In production you should also block /web/database via Nginx (already done
; in nginx/odoo.conf). This is a second line of defence.
; -----------------------------------------------------------------------------
dbfilter = .*
list_db = True   ; Set to False to hide the DB list from the login page

; -----------------------------------------------------------------------------
; Unaccent — improves search performance when the pg_trgm extension is used
; -----------------------------------------------------------------------------
unaccent = False
