[app]
app_name = odoo-piauhy-agent
app_version = 1.0.0
environment = production
debug = false
log_level = INFO
log_format = %%(asctime)s [%%(levelname)s] %%(message)s

[server]
host = 0.0.0.0
port = 8080
healthcheck_port = 8081
workers = 4
timeout = 300
keep_alive = 75

[odoo]
url = https://mmp.intelligenti.com.br
db = mmp.intelligenti.com.br
user = chat.teste
password = @parada2024
timeout = 120
retry_attempts = 3
retry_delay = 5

[processing]
max_workers = 10
batch_size = 500
data_limite_dias = 45
limite_tokens_sentenca = 30000
limite_tokens_acordao = 20000
limite_casos_teste = 100
ignorar_filtro_total = true

[ai]
provider = claude
model = claude-opus-4-5
max_tokens = 4096
temperature = 0.1
timeout = 180
retry_attempts = 3
retry_delay = 10

[csv]
output_file = resultados_resultado_decisorio_final.csv
delimiter = ,
encoding = utf-8
include_header = true
fields = timestamp,dossie_id,dossie,processo,projeto,data_sentenca,data_acordao,classificacao_final,gera_obrigacao_de_pagar,gera_apenas_obrigacao_de_fazer_ou_nao_fazer,gera_obrigacao_hibrida,gera_somente_declaracao_sem_condenacao_material,grau_de_confianca_classificacao,motivo_de_inseguranca,agente_1_resultado_final,agente_1_condenacao_material,agente_1_resumo_tecnico,agente_1_json,agente_2_json,erro

[pdf]
mime_type = application/pdf
dpi = 200
max_pages = 100
ocr_language = por
ocr_timeout = 60

[html]
mime_types = text/html,application/xhtml+xml
parser = html.parser
timeout = 30

[n8n]
enabled = true
webhook_url =
api_key =
poll_interval = 30
event_on_start = true
event_on_complete = true
event_on_error = true
event_on_progress = true
progress_batch_interval = 50

[agent]
agent_1_enabled = true
agent_2_enabled = true
agent_1_timeout = 180
agent_2_timeout = 120
confidence_threshold = medio
fallback_on_low_confidence = false

[filters]
projeto_alvo =
grupo_alvo =
apply_date_filter = true
apply_project_filter = false
apply_group_filter = false

[debug]
debug_mode = false
debugpy_host = 0.0.0.0
debugpy_port = 5678
wait_for_client = true
enable_profiling = false
profile_output = profile_output.prof

[healthcheck]
enabled = true
endpoint = /health
interval = 30
timeout = 10
failure_threshold = 3

[queue]
max_size = 1000
worker_threads = 10
drain_timeout = 60
block_on_full = true
full_wait_timeout = 5

[cache]
enabled = false
backend = memory
ttl = 3600
max_size = 500

[retry]
max_attempts = 3
backoff_factor = 2
initial_delay = 1
max_delay = 60
jitter = true

[logging]
level = INFO
format = %%(asctime)s [%%(levelname)s] %%(message)s
handler = stream
file_path = logs/app.log
max_bytes = 10485760
backup_count = 5
enable_request_logging = false