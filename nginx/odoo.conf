# =============================================================================
# Nginx Reverse Proxy Configuration for Odoo 17
# Repository: guilhermePiauhy/odoo-piauhy
#
# Handles:
#   - HTTP -> HTTPS redirect (port 80 -> 443)
#   - Upstream proxy to Odoo web service (port 8069)
#   - Upstream proxy to Odoo longpolling service (port 8072)
#   - Correct proxy headers for Odoo session/IP detection
#   - Buffering and timeout tuning for large file uploads
#   - Gzip compression for web assets
# =============================================================================

# --------------------------------------------------------------------------
# Upstreams
# --------------------------------------------------------------------------
upstream odoo_web {
    server odoo:8069 weight=1 fail_timeout=0;
}

upstream odoo_longpolling {
    server odoo:8072 weight=1 fail_timeout=0;
}

# --------------------------------------------------------------------------
# Gzip
# --------------------------------------------------------------------------
gzip on;
gzip_min_length 1100;
gzip_buffers 4 32k;
gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript
    image/svg+xml;
gzip_vary on;

# --------------------------------------------------------------------------
# HTTP — Redirect all traffic to HTTPS
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;   # Replace _ with your domain, e.g.: server_name odoo.example.com;

    # Allow Let's Encrypt ACME challenges when using Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------
# HTTPS — Main Odoo server block
# --------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;   # Replace _ with your domain

    # ------------------------------------------------------------------
    # TLS — Update paths to match your certificate locations.
    # If using Let's Encrypt / Certbot:
    #   ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
    # ------------------------------------------------------------------
    ssl_certificate     /etc/ssl/certs/odoo.crt;
    ssl_certificate_key /etc/ssl/private/odoo.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — enable only after confirming HTTPS works end-to-end
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------
    # Proxy timeouts and buffer tuning for large Odoo uploads
    # ------------------------------------------------------------------
    proxy_read_timeout      720s;
    proxy_connect_timeout   720s;
    proxy_send_timeout      720s;

    client_max_body_size    200m;
    client_body_buffer_size 128k;

    proxy_buffers           16 64k;
    proxy_buffer_size       128k;

    # ------------------------------------------------------------------
    # Common proxy headers passed to Odoo
    # ------------------------------------------------------------------
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Prevent Nginx from rewriting headers from Odoo's own redirects
    proxy_redirect off;

    # ------------------------------------------------------------------
    # Longpolling — live chat, bus notifications
    # ------------------------------------------------------------------
    location /web/websocket {
        proxy_pass http://odoo_longpolling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /longpolling {
        proxy_pass http://odoo_longpolling;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Static assets — served with long-lived cache
    # ------------------------------------------------------------------
    location ~* /web/static/ {
        proxy_pass http://odoo_web;
        proxy_cache_valid 200 90d;
        proxy_buffering   on;
        expires 864000;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------
    # Odoo web application — all other requests
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://odoo_web;
    }

    # ------------------------------------------------------------------
    # Block access to Odoo manager and DB manager from the internet
    # Remove the two blocks below only if you need external DB access.
    # ------------------------------------------------------------------
    location ~* /web/database/ {
        deny all;
        return 403;
    }

    location ~* /web/databrowse/ {
        deny all;
        return 403;
    }
}
